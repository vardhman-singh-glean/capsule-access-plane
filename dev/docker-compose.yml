services:
  access-plane:
    build: ..
    ports:
      - "8080:8080"
    env_file: env.example
    volumes:
      - data:/data
    environment:
      - DATABASE_URL=/data/capsule-access.db
      # Allow non-provider hosts to be tunneled transparently.
      # Set to "true" for local dev; omit or "false" in production.
      - PROXY_ALLOW_PASSTHROUGH=${PROXY_ALLOW_PASSTHROUGH:-true}

volumes:
  data:
